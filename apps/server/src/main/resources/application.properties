spring.application.name=notopi-server

# API keys come from apps/server/.env.local (git-ignored; copy .env.example) or the environment.
spring.config.import=optional:file:./.env.local[.properties]

# The SerpApi key lives only here (from the environment), never in the app.
notopi.serpapi.key=${SERPAPI_KEY:}
notopi.serpapi.base-url=https://serpapi.com

# Requests allowed per device per minute.
notopi.rate-limit.per-minute=30

# Identical searches within 6 hours are served from memory instead of spending SerpApi credits.
spring.cache.cache-names=serp
spring.cache.caffeine.spec=maximumSize=5000,expireAfterWrite=6h

# Trending scams: a language model filters and summarises this week's Indian scam news, with
# sources. Providers are tried in order: Groq, then an optional second OpenAI-compatible provider
# (set LLM2_* to use one, e.g. OpenRouter or OpenAI), then Gemini. A provider without a key is skipped.
notopi.llm.providers[0].name=groq
notopi.llm.providers[0].base-url=https://api.groq.com/openai/v1
notopi.llm.providers[0].key=${GROQ_API_KEY:}
notopi.llm.providers[0].models=${GROQ_MODELS:openai/gpt-oss-120b,llama-3.3-70b-versatile}
notopi.llm.providers[1].name=${LLM2_NAME:second}
notopi.llm.providers[1].base-url=${LLM2_BASE_URL:https://openrouter.ai/api/v1}
notopi.llm.providers[1].key=${LLM2_API_KEY:}
notopi.llm.providers[1].models=${LLM2_MODELS:}
notopi.gemini.key=${GEMINI_API_KEY:}
notopi.gemini.base-url=https://generativelanguage.googleapis.com
notopi.gemini.models=${GEMINI_MODELS:models/gemini-3.8-flash,models/gemini-3.7-flash,models/gemini-flash-latest}

# Two Google News searches per refresh, once a day: about 60 SerpApi credits a month.
notopi.trending.queries=cyber fraud police warn India when:7d,scam alert India when:7d
notopi.trending.file=data/trending.json
notopi.trending.refresh-token=${TRENDING_REFRESH_TOKEN:}
notopi.trending.refresh-on-start=true

management.endpoints.web.exposure.include=health,info
