# Brands that scammers commonly impersonate, with the domains they really use.
# A link that mentions a brand but isn't on one of its domains is a strong warning sign.
brands:
  - name: SBI
    keywords: [sbi, onlinesbi, yonosbi, yono]
    domains: [sbi.co.in, onlinesbi.sbi, sbi, sbicard.com]
  - name: HDFC Bank
    keywords: [hdfc]
    domains: [hdfcbank.com, hdfc.com]
  - name: ICICI Bank
    keywords: [icici]
    domains: [icicibank.com]
  - name: Axis Bank
    keywords: [axisbank, axis-bank]
    domains: [axisbank.com]
  - name: Paytm
    keywords: [paytm]
    domains: [paytm.com, paytmbank.com]
  - name: PhonePe
    keywords: [phonepe]
    domains: [phonepe.com]
  - name: Google Pay
    keywords: [gpay, googlepay]
    domains: [pay.google.com, google.com]
  - name: Amazon
    keywords: [amazon, amzn]
    domains: [amazon.in, amazon.com, amzn.in, amzn.to]
  - name: Flipkart
    keywords: [flipkart]
    domains: [flipkart.com, fkrt.it]
  - name: IRCTC
    keywords: [irctc]
    domains: [irctc.co.in]
  - name: India Post
    keywords: [indiapost, india-post, speedpost]
    domains: [indiapost.gov.in]
  - name: UIDAI (Aadhaar)
    keywords: [uidai, aadhaar, aadhar]
    domains: [uidai.gov.in, myaadhaar.uidai.gov.in]
  - name: Income Tax
    keywords: [incometax, income-tax, itr-refund]
    domains: [incometax.gov.in]
  - name: EPFO
    keywords: [epfo, pf-claim, uan]
    domains: [epfindia.gov.in]
  - name: Parivahan (challan)
    keywords: [parivahan, echallan, e-challan, challan, rto]
    domains: [parivahan.gov.in]
  - name: LIC
    keywords: [lic]
    domains: [licindia.in]

# Top-level domains that show up far more often in phishing than in real Indian services.
risky_tlds: [xyz, top, click, buzz, icu, cyou, sbs, cfd, rest, monster, live, online, site, shop, vip, apk]

# Link shorteners hide the real destination.
shorteners: [bit.ly, tinyurl.com, cutt.ly, is.gd, t.ly, rb.gy, shorturl.at, tiny.cc, ow.ly, s.id]
